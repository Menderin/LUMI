[env:banco]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
monitor_speed = 115200
build_flags = -DLUMI_ENABLE_POWER=0


[env:wifi_banco]
extends = env:banco
build_flags = -DLUMI_WIFI_BANK=1 -DLUMI_ENABLE_POWER=1

[env:wifi_banco_seco]
extends = env:wifi_banco
build_flags = -DLUMI_WIFI_BANK=1 -DLUMI_ENABLE_POWER=0
